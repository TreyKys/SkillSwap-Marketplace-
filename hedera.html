<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap - Hedera Version</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --hedera-green: #2DD87F; --hedera-dark: #1A1A1A; --white-glass: rgba(255, 255, 255, 0.98);
            --text-dark: #333; --text-light: #555;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(-45deg, #2DD87F, #1F3D2F, #1A1A1A); background-size: 400% 400%; animation: gradientShift 15s ease infinite; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .container { width: 100%; max-width: 480px; background: var(--white-glass); min-height: 95vh; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); overflow: hidden; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #1A1A1A, #000000); color: white; padding: 20px; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-family: 'Comfortaa', cursive; font-size: 24px; }
        .wallet-btn { background: var(--hedera-green); color: var(--hedera-dark); border: none; padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .wallet-btn:disabled { background: #eee; cursor: wait; color: #999; }
        .account-id { font-size: 12px; background: rgba(255, 255, 255, 0.1); padding: 4px 10px; border-radius: 15px; font-weight: 500; margin-top: 5px; }
        .nav-tabs { display: flex; background: white; border-bottom: 1px solid #eee; flex-shrink: 0; }
        .nav-tab { flex: 1; padding: 15px; text-align: center; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; color: var(--text-light); }
        .nav-tab.active { border-bottom-color: var(--hedera-green); color: var(--hedera-dark); }
        .page-container { flex-grow: 1; overflow-y: auto; }
        .page-section { padding: 20px; display: none; }
        .page-section.active { display: block; }
        .hedera-button { background: var(--hedera-green); color: black; border: none; padding: 14px; border-radius: 12px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: 600; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #f0f0f0; }
        .status-message { padding: 10px; border-radius: 8px; margin: 10px 0; text-align: center; }
        .status-info { background: #e3f2fd; color: #1565c0; }
        .status-success { background: #e8f5e8; color: #2e7d32; }
        .status-error { background: #ffebee; color: #c62828; }
        .version-switcher { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 10px; }
        .connection-options { display: flex; gap: 10px; margin-top: 15px; }
        .connection-options button { flex: 1; }
        .library-loading { text-align: center; padding: 20px; }
        .retry-button { background: #ff6b35; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="version-switcher">
        <strong>SkillSwap:</strong> 
        <a href="/" style="color: #764BA2;">Pi Network</a> | 
        <a href="/hedera.html" style="color: #2DD87F;">Hedera</a>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-content">
                <div><h1>SkillSwap</h1><p>Powered by Hedera</p></div>
                <button id="connect-wallet-btn" class="wallet-btn"><i class="fas fa-wallet"></i> Connect Wallet</button>
            </div>
        </div>

        <div class="page-container">
            <div class="card">
                <h3>Connect to Hedera</h3>
                <div id="status-message" class="status-message status-info">
                    Loading HashConnect library...
                </div>

                <div id="library-loading" class="library-loading">
                    <div id="loading-spinner" style="display: none;">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p>Loading HashConnect...</p>
                    </div>
                    <div id="library-error" style="display: none;">
                        <i class="fas fa-exclamation-triangle fa-2x" style="color: #ff6b35;"></i>
                        <p>HashConnect library failed to load</p>
                        <button id="retry-load" class="retry-button">Retry Loading</button>
                    </div>
                </div>
                
                <div id="connection-options" class="connection-options" style="display: none;">
                    <button id="qr-btn" class="hedera-button"><i class="fas fa-qrcode"></i> QR Code</button>
                    <button id="pairing-btn" class="hedera-button"><i class="fas fa-copy"></i> Pairing Code</button>
                </div>

                <div id="qr-container" style="display: none; text-align: center;">
                    <p><strong>Scan with HashPack:</strong></p>
                    <img id="qr-image" style="max-width: 200px; margin: 10px 0;">
                </div>

                <div id="pairing-container" style="display: none;">
                    <p><strong>Copy this code to HashPack:</strong></p>
                    <textarea id="pairing-string" style="width: 100%; height: 60px; margin: 10px 0; padding: 10px; border-radius: 5px; border: 1px solid #ccc;" readonly></textarea>
                    <button id="copy-btn" class="hedera-button"><i class="fas fa-copy"></i> Copy Code</button>
                </div>

                <div id="connection-info" style="display: none;">
                    <p><strong>Connected Account:</strong> <span id="account-id"></span></p>
                    <button id="disconnect-btn" class="hedera-button" style="background: #ff4444; color: white;">
                        <i class="fas fa-sign-out-alt"></i> Disconnect Wallet
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Multiple CDN fallbacks for HashConnect -->
    <script>
        // HashConnect loading with multiple fallbacks
        function loadHashConnect() {
            const loadingSpinner = document.getElementById('loading-spinner');
            const libraryError = document.getElementById('library-error');
            const statusMessage = document.getElementById('status-message');
            
            loadingSpinner.style.display = 'block';
            libraryError.style.display = 'none';
            statusMessage.textContent = 'Loading HashConnect library...';

            // Try multiple CDNs in sequence
            const cdns = [
                'https://unpkg.com/hashconnect@0.7.12/dist/index.js',
                'https://cdn.jsdelivr.net/npm/hashconnect@0.7.12/dist/index.js',
                'https://www.unpkg.com/hashconnect@0.7.12/dist/index.js'
            ];

            let currentCdnIndex = 0;

            function tryNextCDN() {
                if (currentCdnIndex >= cdns.length) {
                    // All CDNs failed
                    loadingSpinner.style.display = 'none';
                    libraryError.style.display = 'block';
                    statusMessage.textContent = 'Error: HashConnect library not found. Check network connection.';
                    statusMessage.className = 'status-message status-error';
                    return;
                }

                const script = document.createElement('script');
                script.src = cdns[currentCdnIndex];
                
                script.onload = function() {
                    loadingSpinner.style.display = 'none';
                    if (typeof HashConnect !== 'undefined') {
                        statusMessage.textContent = 'HashConnect loaded successfully!';
                        initializeApp();
                    } else {
                        tryNextCDN();
                    }
                };
                
                script.onerror = function() {
                    currentCdnIndex++;
                    tryNextCDN();
                };
                
                document.head.appendChild(script);
            }

            tryNextCDN();
        }

        // Initialize the app once HashConnect is loaded
        function initializeApp() {
            const statusMessage = document.getElementById('status-message');
            const connectWalletBtn = document.getElementById('connect-wallet-btn');
            const connectionOptions = document.getElementById('connection-options');
            const qrContainer = document.getElementById('qr-container');
            const pairingContainer = document.getElementById('pairing-container');
            const connectionInfo = document.getElementById('connection-info');
            const accountIdSpan = document.getElementById('account-id');
            const disconnectBtn = document.getElementById('disconnect-btn');
            const qrBtn = document.getElementById('qr-btn');
            const pairingBtn = document.getElementById('pairing-btn');
            const copyBtn = document.getElementById('copy-btn');
            const qrImage = document.getElementById('qr-image');
            const pairingStringEl = document.getElementById('pairing-string');

            let hashConnect;
            let pairingString = "";

            async function initHashConnect() {
                try {
                    statusMessage.textContent = "Initializing HashConnect...";
                    
                    // Initialize HashConnect
                    hashConnect = new HashConnect(false); // false for production
                    
                    const appMetadata = {
                        name: "SkillSwap Marketplace",
                        description: "Decentralized skill marketplace",
                        icon: "https://www.hedera.com/favicon.ico"
                    };

                    const initData = await hashConnect.init(appMetadata, "testnet", false);
                    pairingString = initData.pairingString;

                    // Check for existing connections
                    if (initData.savedPairings.length > 0) {
                        const savedPairing = initData.savedPairings[0];
                        handleSuccessfulConnection(savedPairing.accountIds[0]);
                    } else {
                        showConnectionReady();
                    }

                    // Listen for new pairings
                    hashConnect.pairingEvent.on((pairingData) => {
                        if (pairingData.accountIds && pairingData.accountIds.length > 0) {
                            handleSuccessfulConnection(pairingData.accountIds[0]);
                        }
                    });

                } catch (error) {
                    console.error("Initialization error:", error);
                    statusMessage.textContent = "Failed to initialize wallet connection. Please refresh the page.";
                    statusMessage.className = "status-message status-error";
                }
            }

            function showConnectionReady() {
                statusMessage.textContent = "Ready to connect! Choose connection method:";
                connectionOptions.style.display = 'flex';
            }

            function showQRCode() {
                const qrUrl = `https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=${encodeURIComponent(pairingString)}`;
                qrImage.src = qrUrl;
                qrContainer.style.display = 'block';
                pairingContainer.style.display = 'none';
                
                if (hashConnect) {
                    hashConnect.connectToLocalWallet();
                }
            }

            function showPairingString() {
                pairingStringEl.value = pairingString;
                pairingContainer.style.display = 'block';
                qrContainer.style.display = 'none';
                
                if (hashConnect) {
                    hashConnect.connectToLocalWallet();
                }
            }

            function copyPairingString() {
                pairingStringEl.select();
                document.execCommand('copy');
                alert("Pairing code copied! Open HashPack and paste this code to connect.");
            }

            function handleSuccessfulConnection(accountId) {
                accountIdSpan.textContent = accountId;
                connectionInfo.style.display = 'block';
                connectionOptions.style.display = 'none';
                qrContainer.style.display = 'none';
                pairingContainer.style.display = 'none';
                connectWalletBtn.style.display = 'none';
                
                statusMessage.innerHTML = `<i class="fas fa-check-circle"></i> Connected to Hedera!`;
                statusMessage.className = "status-message status-success";
            }

            function disconnectWallet() {
                if (hashConnect) {
                    try {
                        const pairings = hashConnect.hcData.pairingData;
                        if (pairings && pairings.length > 0) {
                            hashConnect.disconnect(pairings[0].topic);
                        }
                    } catch (error) {
                        console.error("Error disconnecting:", error);
                    }
                }

                connectionInfo.style.display = 'none';
                connectionOptions.style.display = 'none';
                qrContainer.style.display = 'none';
                pairingContainer.style.display = 'none';
                connectWalletBtn.style.display = 'block';
                connectWalletBtn.disabled = false;
                
                statusMessage.textContent = "Disconnected. Click 'Connect Wallet' to reconnect.";
                statusMessage.className = "status-message status-info";

                setTimeout(initHashConnect, 1000);
            }

            // Event listeners
            connectWalletBtn.addEventListener('click', initHashConnect);
            qrBtn.addEventListener('click', showQRCode);
            pairingBtn.addEventListener('click', showPairingString);
            copyBtn.addEventListener('click', copyPairingString);
            disconnectBtn.addEventListener('click', disconnectWallet);
            document.getElementById('retry-load').addEventListener('click', loadHashConnect);

            // Initialize HashConnect
            statusMessage.textContent = "Click 'Connect Wallet' to start";
        }

        // Start loading when page loads
        document.addEventListener('DOMContentLoaded', loadHashConnect);
    </script>
</body>
</html>
