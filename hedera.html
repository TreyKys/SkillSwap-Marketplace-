<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap - Hedera</title>
    <script>
        if (window.location.protocol !== "https:") {
            window.location.href = "https:" + window.location.href.substring(window.location.protocol.length);
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --hedera-green: #2DD87F; --hedera-dark: #1A1A1A; --white-glass: rgba(255, 255, 255, 0.98); }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(-45deg, #2DD87F, #1F3D2F, #1A1A1A); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; margin: 0; }
        .container { width: 100%; max-width: 480px; background: var(--white-glass); min-height: 95vh; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); overflow: hidden; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #1A1A1A, #000000); color: white; padding: 20px; text-align: center; }
        .header h1 { font-family: 'Comfortaa', cursive; font-size: 28px; margin: 0; }
        .header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
        .page-container { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; }
        .hedera-button { background: var(--hedera-green); color: black; border: none; padding: 14px; border-radius: 12px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: 600; }
        .status-message { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; word-break: break-word; }
        .status-info { background: #e3f2fd; color: #1565c0; }
        .status-success { background: #e8f5e8; color: #2e7d32; }
        .status-error { background: #ffebee; color: #c62828; }
        textarea { width: 100%; height: 80px; margin: 10px 0; padding: 10px; border-radius: 5px; border: 1px solid #ccc; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SkillSwap</h1>
            <p>Powered by Hedera</p>
        </div>
        <div class="page-container">
            <div class="card">
                <h3>Wallet Connection</h3>
                <div id="status-message" class="status-message status-info">Initializing...</div>
                <div id="connect-area" style="display: none;">
                    <p>Copy the code and paste it into HashPack to connect.</p>
                    <textarea id="pairing-string" readonly></textarea>
                    <button id="copy-btn" class="hedera-button">Copy Pairing Code</button>
                </div>
                <div id="connected-area" style="display: none;">
                    <p><strong>Connected Account:</strong></p>
                    <p id="account-id" style="font-weight: bold; word-break: break-all;"></p>
                    <button id="disconnect-btn" class="hedera-button" style="background: #ff4444; color: white;">Disconnect</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hashconnect@latest/dist/index.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusMessage = document.getElementById('status-message');
            const connectArea = document.getElementById('connect-area');
            const connectedArea = document.getElementById('connected-area');
            const accountIdSpan = document.getElementById('account-id');
            const disconnectBtn = document.getElementById('disconnect-btn');
            const copyBtn = document.getElementById('copy-btn');
            const pairingStringEl = document.getElementById('pairing-string');

            let hashConnect;
            let state = { accountId: "" };
            const appMetadata = { name: "SkillSwap Marketplace", description: "A decentralized skill marketplace", icon: "" };

            function setupEvents() {
                hashConnect.pairingEvent.on(pairingData => {
                    if (pairingData.accountIds && pairingData.accountIds.length > 0) {
                        handleSuccessfulConnection(pairingData.accountIds[0]);
                    }
                });
            }

            async function initializeApp() {
                try {
                    if (typeof HashConnect === 'undefined') {
                        throw new Error('HashConnect library failed to load.');
                    }
                    hashConnect = new HashConnect(true);
                    setupEvents();
                    const initData = await hashConnect.init(appMetadata, "testnet", false);

                    if (initData.savedPairings.length > 0) {
                        handleSuccessfulConnection(initData.savedPairings[0].accountIds[0]);
                    } else {
                        pairingStringEl.value = initData.pairingString;
                        showConnectionOptions();
                    }
                } catch (error) {
                    console.error("Initialization error:", error);
                    statusMessage.textContent = `Error: ${error.message}. This app requires a secure (HTTPS) connection. Please check your URL.`;
                    statusMessage.className = "status-message status-error";
                }
            }

            function showConnectionOptions() {
                statusMessage.textContent = "Ready to connect.";
                connectArea.style.display = 'block';
                connectedArea.style.display = 'none';
            }

            function handleSuccessfulConnection(accountId) {
                state.accountId = accountId;
                accountIdSpan.textContent = state.accountId;
                connectArea.style.display = 'none';
                connectedArea.style.display = 'block';
                statusMessage.innerHTML = `<i class="fas fa-check-circle"></i> Wallet Connected!`;
                statusMessage.className = "status-message status-success";
            }

            async function disconnectWallet() {
                const pairings = hashConnect.hcData.pairingData;
                if (pairings && pairings.length > 0) {
                    await hashConnect.disconnect(pairings[0].topic);
                }
                state.accountId = "";
                connectedArea.style.display = 'none';
                statusMessage.textContent = 'Initializing...';
                initializeApp();
            }

            copyBtn.addEventListener('click', () => {
                pairingStringEl.select();
                document.execCommand('copy');
                alert("Pairing code copied! Open HashPack, go to 'Connect DApp' and paste the code.");
            });
            disconnectBtn.addEventListener('click', disconnectWallet);

            initializeApp();
        });
    </script>
</body>
</html>
