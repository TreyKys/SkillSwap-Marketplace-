<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap - Hedera with AppKit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --hedera-green: #2DD87F; --hedera-dark: #1A1A1A; --white-glass: rgba(255, 255, 255, 0.98); }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(-45deg, #2DD87F, #1F3D2F, #1A1A1A); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; margin: 0; }
        .container { width: 100%; max-width: 480px; background: var(--white-glass); min-height: 95vh; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); overflow: hidden; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #1A1A1A, #000000); color: white; padding: 20px; text-align: center; }
        .header h1 { font-family: 'Comfortaa', cursive; font-size: 28px; margin: 0; }
        .header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
        .page-container { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; }
        .hedera-button { background: var(--hedera-green); color: black; border: none; padding: 14px; border-radius: 12px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .status-message { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; word-break: break-word; }
        .status-info { background: #e3f2fd; color: #1565c0; }
        .status-success { background: #e8f5e8; color: #2e7d32; }
        .status-error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SkillSwap</h1>
            <p>Powered by Hedera</p>
        </div>
        <div class="page-container">
            <div class="card">
                <h3>Wallet Connection</h3>
                <div id="status-message" class="status-message status-info">Ready to connect.</div>
                
                <div id="connect-button-container"></div>
                
                <div id="connected-area" style="display: none;">
                    <p><strong>Connected Account:</strong></p>
                    <p id="account-id" style="font-weight: bold; word-break: break-all;"></p>
                    <button id="disconnect-btn" class="hedera-button" style="background: #ff4444; color: white;">Disconnect</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import necessary functions from Reown AppKit using a CDN
        import { createAppKit } from 'https://cdn.jsdelivr.net/npm/@reown/appkit@latest/dist/index.js';
        import { UniversalConnector } from 'https://cdn.jsdelivr.net/npm/@reown/appkit-universal-connector@latest/dist/index.js';

        // --- 1. CONFIGURATION ---

        // Get your project ID from https://dashboard.reown.com
        const projectId = '2798ba475f686a8e0ec83cc2cceb095b';
        if (projectId === 2798ba475f686a8e0ec83cc2cceb095b') {
            alert('Please replace "2798ba475f686a8e0ec83cc2cceb095b" with your actual Project ID from dashboard.reown.com');
        }

        // Define the Hedera Testnet configuration
        const hederaTestnet = {
            id: '296', // Hedera Testnet Chain ID
            chainNamespace: 'hedera',
            caipNetworkId: 'hedera:testnet',
            name: 'Hedera Testnet',
            nativeCurrency: { name: 'HBAR', symbol: 'HBAR', decimals: 8 },
            rpcUrls: { default: { http: ['https://testnet.hashio.io/api'] } } // Public RPC
        };

        // --- 2. INITIALIZE APPKIT ---

        let universalConnector;
        let modal;

        async function initializeAppKit() {
            try {
                // Initialize the Universal Connector for custom chains
                universalConnector = await UniversalConnector.init({
                    projectId,
                    metadata: {
                        name: 'SkillSwap Marketplace',
                        description: 'A skill marketplace on Hedera',
                        url: 'https://hederaskillswap.netlify.app',
                        icons: []
                    },
                    // Configure the connector for the Hedera namespace
                    networks: [{
                        methods: ['hedera_signMessage', 'hedera_sendTransaction'],
                        chains: [hederaTestnet],
                        events: ['hedera_chainChanged'],
                        namespace: 'hedera'
                    }]
                });

                // Create the AppKit modal instance
                modal = createAppKit({
                    adapters: [universalConnector],
                    networks: [hederaTestnet],
                    projectId,
                    features: {
                        analytics: true
                    }
                });
                
                // --- 3. UI LOGIC ---

                const connectContainer = document.getElementById('connect-button-container');
                const connectedArea = document.getElementById('connected-area');
                const accountIdSpan = document.getElementById('account-id');
                const disconnectBtn = document.getElementById('disconnect-btn');
                const statusMessage = document.getElementById('status-message');

                // Create and inject the AppKit button
                const appkitButton = document.createElement('appkit-button');
                connectContainer.appendChild(appkitButton);

                // Listen for account changes
                modal.subscribeAccount(state => {
                    if (state.address) {
                        accountIdSpan.textContent = state.address;
                        connectContainer.style.display = 'none';
                        connectedArea.style.display = 'block';
                        statusMessage.innerHTML = `<i class="fas fa-check-circle"></i> Wallet Connected!`;
                        statusMessage.className = "status-message status-success";
                    } else {
                        connectContainer.style.display = 'block';
                        connectedArea.style.display = 'none';
                        statusMessage.textContent = 'Ready to connect.';
                        statusMessage.className = "status-message status-info";
                    }
                });

                // Handle disconnect
                disconnectBtn.addEventListener('click', () => {
                    modal.disconnect();
                });

            } catch (error) {
                console.error("AppKit Initialization Error:", error);
                document.getElementById('status-message').textContent = `Error: ${error.message}`;
                document.getElementById('status-message').className = 'status-message status-error';
            }
        }

        initializeApp();

    </script>
</body>
</html>
