<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap - Hedera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --hedera-green: #2DD87F; --hedera-dark: #1A1A1A; --white-glass: rgba(255, 255, 255, 0.98); }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(-45deg, #2DD87F, #1F3D2F, #1A1A1A); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; margin: 0; }
        .container { width: 100%; max-width: 480px; background: var(--white-glass); min-height: 95vh; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); overflow: hidden; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #1A1A1A, #000000); color: white; padding: 20px; text-align: center; }
        .header h1 { font-family: 'Comfortaa', cursive; font-size: 28px; margin: 0; }
        .header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
        .page-container { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; }
        .hedera-button { background: var(--hedera-green); color: black; border: none; padding: 14px; border-radius: 12px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .status-message { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; word-break: break-word; }
        .status-info { background: #e3f2fd; color: #1565c0; }
        .status-success { background: #e8f5e8; color: #2e7d32; }
        .status-error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SkillSwap</h1>
            <p>Powered by Hedera</p>
        </div>
        <div class="page-container">
            <div class="card">
                <h3>Wallet Connection</h3>
                <div id="status-message" class="status-message status-info">Ready to connect.</div>
                <div id="connect-area">
                     <button id="connect-btn" class="hedera-button"><i class="fas fa-wallet"></i> Connect Wallet</button>
                </div>
                <div id="connected-area" style="display: none;">
                    <p><strong>Connected Account:</strong></p>
                    <p id="account-id" style="font-weight: bold; word-break: break-all;"></p>
                    <button id="disconnect-btn" class="hedera-button" style="background: #ff4444; color: white;">Disconnect</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createWeb3Modal, defaultWagmiConfig } from 'https://esm.sh/@web3modal/wagmi/vue'
        import { mainnet, arbitrum } from 'https://esm.sh/viem/chains'
        import { reconnect, watchAccount, disconnect } from 'https://esm.sh/@wagmi/core'

        // 1. Get project ID from https://cloud.walletconnect.com
        const projectId = 'd5b51a566a7b337836b6d51a6659f8a3' // This is a public demo ID

        // 2. Create wagmiConfig
        const metadata = {
          name: 'SkillSwap Marketplace',
          description: 'A decentralized skill marketplace on Hedera',
          url: 'https://hederaskillswap.netlify.app',
          icons: ['https://avatars.githubusercontent.com/u/37784886']
        }

        // NOTE: We list standard EVM chains here, but WalletConnect will allow connection to Hedera via HashPack.
        const chains = [mainnet, arbitrum] 
        const wagmiConfig = defaultWagmiConfig({ chains, projectId, metadata })

        // 3. Create modal
        const modal = createWeb3Modal({ wagmiConfig, projectId, chains })

        // --- App Logic ---
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const connectArea = document.getElementById('connect-area');
        const connectedArea = document.getElementById('connected-area');
        const accountIdSpan = document.getElementById('account-id');
        const statusMessage = document.getElementById('status-message');

        async function initialize() {
            try {
                await reconnect(wagmiConfig);
            } catch (err) {
                console.error("Reconnect failed:", err);
            }
        }

        function handleConnect(state) {
            if (state.isConnected && state.address) {
                // NOTE: For Hedera, the address from WalletConnect might be an EVM address.
                // The actual Account ID is usually retrieved in a follow-up step.
                // For now, we display what we get.
                accountIdSpan.textContent = state.address;
                connectArea.style.display = 'none';
                connectedArea.style.display = 'block';
                statusMessage.innerHTML = `<i class="fas fa-check-circle"></i> Wallet Connected!`;
                statusMessage.className = "status-message status-success";
            } else {
                connectedArea.style.display = 'none';
                connectArea.style.display = 'block';
                statusMessage.textContent = 'Ready to connect.';
                statusMessage.className = "status-message status-info";
            }
        }

        // Watch for connection changes and update the UI
        watchAccount(wagmiConfig, { onChange: handleConnect });

        // Set up button listeners
        connectBtn.addEventListener('click', () => modal.open());
        disconnectBtn.addEventListener('click', () => disconnect(wagmiConfig));

        // Initialize on page load
        initialize();
    </script>
</body>
</html>
