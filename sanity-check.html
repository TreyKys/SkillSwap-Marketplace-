<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HashConnect Barebones Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        h1 { color: #333; }
        #log { border: 1px solid #ccc; padding: 10px; background: #f9f9f9; white-space: pre-wrap; word-wrap: break-word; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>HashConnect Initialization Test</h1>
    <div id="log"></div>

    <script src="https://unpkg.com/hashconnect@2.1.2/dist/index.js"></script>

    <script>
        const logDiv = document.getElementById('log');

        function log(message, isError = false) {
            const p = document.createElement('p');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            if (isError) {
                p.className = 'error';
            }
            logDiv.appendChild(p);
        }

        async function runTest() {
            log('Script started.');

            if (typeof HashConnect === 'undefined') {
                log('CRITICAL FAILURE: HashConnect object is not defined. The library failed to load.', true);
                return;
            }
            log('SUCCESS: HashConnect library loaded.');

            try {
                log('Creating new HashConnect instance...');
                const hashConnect = new HashConnect(true);
                log('Instance created.');

                const appMetadata = { name: "Test DApp", description: "A test", icon: "" };
                log('App metadata defined.');

                log('Setting up events...');
                hashConnect.pairingEvent.on(data => {
                    log('Pairing event fired!');
                });
                log('Events set up.');

                log('Attempting to call hashConnect.init()...');
                const initData = await hashConnect.init(appMetadata, "testnet", false);
                log('SUCCESS: hashConnect.init() completed without error.');
                log('Pairing String: ' + initData.pairingString);

            } catch (error) {
                log(`CRITICAL FAILURE during initialization: ${error.message}`, true);
                console.error(error);
            }
        }

        runTest();
    </script>
</body>
</html>
